# client.conf - 基于项目设计文档v3.0的客户端配置
# 说明：格式为 key=value；UTF-8 编码

# ===== Kerberos 三阶段目标地址 =====
as_host=172.27.140.192
as_port=8000
tgs_host=172.27.140.192
tgs_port=8001
app_host=172.27.137.241
app_port=8002

# ===== CA 地址（当前可先保留，证书链路关闭时不会使用） =====
