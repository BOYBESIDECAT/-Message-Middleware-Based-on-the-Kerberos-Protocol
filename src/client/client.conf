# client.conf - 基于项目设计文档v3.0的客户端配置
# 说明：格式为 key=value；UTF-8 编码

# ===== Kerberos 三阶段目标地址 =====
as_host=172.27.231.185
as_port=8000
tgs_host=172.27.231.185
tgs_port=8001
app_host=172.27.230.172
app_port=8002

# ===== CA 地址（当前可先保留，证书链路关闭时不会使用） =====
ca_host=172.27.230.162
ca_port=8003

# ===== 客户端身份与本地存储 =====
client_machine_id=CLIENT-HOST-001
client_db_path=data/client_cache.db
identity_store_path=secure/client_identity
log_path=logs/client.log.txt

# ===== Kerberos 服务标识 =====
tgs_id=TGS-001
service_id=CHATSERVER-001

# ===== 客户端地址标识（ADc） =====
adc=172.27.230.160

# ===== 签名严格校验开关 =====
# 0: 非严格（缺少 signature 只告警，不中断）
# 1: 严格（缺少或无效 signature 直接认证失败）
strict_signature_verify=1
